# 当日の 収集(Open API)→ 予想 → export → 公開(Cloudflare Workers)。
# docs/data のコミットは朝(確定した予想の記録)・前日分の確定(最終結果)・週次だけ。日中と lock は公開と状態の保存だけ。
# 公式サイト(boatrace.jp)へはアクセスしない(締切前オッズは取らない)。
# git 管理外の状態は R2 の state/(履歴の集計の状態・当月と前月の raw と interim・予想・採用中のモデル)。
# 生データの全履歴は落とさない。features はジョブ内で状態から作り直す。前日確定ジョブはその月を archive/ にも保存する。
# lock(直前予想の確定。spec/12)は Worker「beforeinfo」が直前情報を R2 に置いたときに race_ids 付きで起動する。
# 起動は Cloudflare Worker(workers/dispatcher)の Cron Trigger から workflow_dispatch で行う。
# GitHub の schedule は遅れや取りこぼしが大きかったため使わない(二重起動も防ぐ)。
# 時刻: 朝 JST 7:41、日中 8:04〜23:34 の30分ごと、前日分の確定 1:12、週の分析 月曜 3:00。
name: daily

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "morning / daytime / finalize / weekly / lock"
        required: true
        default: daytime
        type: choice
        options: [morning, daytime, finalize, weekly, lock]
      date:
        description: "対象日 YYYY-MM-DD(空なら JST の今日。finalize・weekly は昨日)"
        required: false
        default: ""
      race_ids:
        description: "lock: 直前情報を取ったレース(例 20261106-02-01,20261106-12-03)"
        required: false
        default: ""
      deploy:
        description: "Cloudflare に公開する"
        type: boolean
        default: true

permissions:
  contents: write

# 同時に1つだけ。実行中のジョブは止めず、後から来たものを待たせる
concurrency:
  group: daily-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    # lock は5分以内が目標(締切に間に合わせるため)。超えたら打ち切る
    timeout-minutes: ${{ inputs.mode == 'lock' && 8 || 30 }}
    env:
      # データの最初の月(分析の全期間の集計で archive から足す月の始まり)。旧APIを interim に入れたら 2016-08 に
      DATA_FROM_MONTH: "2016-08"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TZ: Asia/Tokyo
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: モードの決定
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_DATE: ${{ inputs.date }}
          IN_DEPLOY: ${{ inputs.deploy }}
        run: |
          case "$SCHEDULE" in
            "41 22 * * *") mode=morning ;;
            "12 16 * * *") mode=finalize ;;
            "0 18 * * 0") mode=weekly ;;
            "") mode="$IN_MODE" ;;
            *) mode=daytime ;;
          esac
          if [ -n "$IN_DATE" ] && ! [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date は YYYY-MM-DD で指定してください" >&2; exit 2
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "date=$IN_DATE" >> "$GITHUB_OUTPUT"
          echo "deploy=${IN_DEPLOY:-true}" >> "$GITHUB_OUTPUT"
          echo "mode=$mode date=${IN_DATE:-(既定)}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ライブラリの導入
        run: |
          # LightGBM が使う OpenMP(ubuntu の runner には通常入っている。無ければ入れる)
          if ! ldconfig -p | grep -q 'libgomp.so.1'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libgomp1
          fi
          python -m pip install -q -r requirements.txt
          python -c "import lightgbm; print('lightgbm', lightgbm.__version__)"

      - name: 状態の取得(R2)
        # lock は軽い状態だけでよいが、特徴量に history・models、予想に predictions・recent が要るので全部(約27MB)
        run: python -m scripts.ci_state pull

      # 分析(spec/11)の全期間の集計用に、recent(直近400日)より前の月の interim を archive から足す
      - name: 過去の月の interim(R2 archive。前日確定・週次のみ)
        if: steps.mode.outputs.mode == 'finalize' || steps.mode.outputs.mode == 'weekly'
        run: python -m scripts.ci_state archive-pull --months auto --part interim

      # lock: 直前情報(R2 beforeinfo/)を data/raw/beforeinfo/ に取る。race_ids は検証してから使う
      - name: 直前情報の取得(R2。lock のみ)
        if: steps.mode.outputs.mode == 'lock'
        env:
          RACE_IDS: ${{ inputs.race_ids }}
          IN_DATE: ${{ steps.mode.outputs.date }}
        run: python -m scripts.ci_state beforeinfo-pull --date "${IN_DATE:-$(date +%F)}" --race-ids "$RACE_IDS"

      - name: 収集・予想・export
        run: bash scripts/ci_run.sh "${{ steps.mode.outputs.mode }}" ${{ steps.mode.outputs.date }}

      # 成功したときだけ status.json を書いて公開に含める(git にはコミットしない)
      # 当日のレース一覧と締切時刻を R2 の schedule/ に置く(Worker「beforeinfo」が読む。変わったときだけ書く)。
      # 失敗しても予想の公開と状態の保存は続ける(Worker は前回の schedule で動く)
      - name: レース一覧(R2 schedule。朝・日中のみ)
        if: steps.mode.outputs.mode == 'morning' || steps.mode.outputs.mode == 'daytime'
        continue-on-error: true
        env:
          IN_DATE: ${{ steps.mode.outputs.date }}
        run: python -m scripts.ci_schedule --date "${IN_DATE:-$(date +%F)}"

      # 週次は公開しない(status.json の job に weekly が無く、公開すると status.json が消えるため)。
      # 週次の出力はコミットし、朝のジョブ(7:41)の公開に含まれる
      - name: 状態ファイル(docs/data/status.json)
        if: steps.mode.outputs.mode != 'weekly'
        run: python -m scripts.ci_status --job "${{ steps.mode.outputs.mode }}"

      - name: 公開(Cloudflare Workers)
        if: steps.mode.outputs.deploy != 'false' && steps.mode.outputs.mode != 'weekly'
        run: bash scripts/deploy_pages.sh

      - name: docs/data のコミット(朝・前日分の確定・週次だけ)
        if: steps.mode.outputs.mode != 'daytime' && steps.mode.outputs.mode != 'lock'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # status.json は .gitignore 済み。除外指定で名前を出すと git add がエラーになるので付けない
          git add -- docs/data
          if git diff --cached --quiet; then
            echo "docs/data に変更はありません"
            exit 0
          fi
          git commit -q -m "データ更新 $(date +%F) ${MODE}($(date +%H:%M) JST)"
          for i in 1 2 3; do
            if git push -q origin HEAD:${{ github.ref_name }}; then exit 0; fi
            git pull -q --rebase origin ${{ github.ref_name }}
          done
          echo "push に失敗しました" >&2; exit 1

      # ここまでのどこかで失敗したら保存しない(壊れた状態で上書きしない)
      # 週次は状態を変えない(data/features と docs/data だけ)ので保存しない
      - name: 状態の保存(R2)
        if: success() && steps.mode.outputs.mode != 'weekly'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          # lock で変わるのは予想と当日の interim・直前情報だけ
          if [ "$MODE" = "lock" ]; then
            python -m scripts.ci_state push --only predictions,recent
          else
            python -m scripts.ci_state push
          fi

      # 前日確定のときは、その月の raw と interim を archive/ にも保存する(月1の作り直し・復元用)
      - name: 月の保存(R2 archive)
        if: success() && steps.mode.outputs.mode == 'finalize'
        env:
          IN_DATE: ${{ steps.mode.outputs.date }}
        run: python -m scripts.ci_state archive-push --months "$(date -d "${IN_DATE:-yesterday}" +%Y-%m)"
