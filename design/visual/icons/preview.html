<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコン確認 | boatrace-yoso</title>
<style>
  /* アイコンの確認用ページ(配布物ではない) */
  body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #E9EBEF; color: #15181E; }
  h2 { font-size: 14px; margin: 20px 0 8px; }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; font-size: 11px; color: #454C5A; }
  img { display: block; margin-bottom: 4px; }
  .circle { border-radius: 50%; }
  .squircle { border-radius: 28%; }
  .drop { border-radius: 50% 50% 50% 12%; }
  .safe { position: relative; display: inline-block; }
  .safe::after { content: ""; position: absolute; left: 10%; top: 10%; width: 80%; height: 80%; border-radius: 50%; outline: 2px dashed #FF4D6D; }
  .dark { background: #0D1015; padding: 12px; border-radius: 12px; }
  .splash { width: 135px; height: 240px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
</style>
</head>
<body>
  <h2>purpose: any(角丸の正方形、角は透過)</h2>
  <div class="row">
    <figure><img src="icon-512.png" width="96" height="96" alt="">512</figure>
    <figure><img src="icon-192.png" width="48" height="48" alt="">192 @48</figure>
    <figure><img src="icon.svg" width="32" height="32" alt="">SVG @32</figure>
    <figure><img src="icon.svg" width="16" height="16" alt="">@16</figure>
    <figure class="dark"><img src="icon-192.png" width="48" height="48" alt=""><span style="color:#B8BFCB">暗い壁紙</span></figure>
  </div>
  <h2>purpose: maskable(各OSのマスクで切り抜いた見え方。赤破線 = 安全領域 80%)</h2>
  <div class="row">
    <figure><span class="safe"><img src="icon-maskable-512.png" width="96" height="96" alt=""></span>全体</figure>
    <figure><img class="circle" src="icon-maskable-512.png" width="96" height="96" alt="">円</figure>
    <figure><img class="squircle" src="icon-maskable-512.png" width="96" height="96" alt="">角丸</figure>
    <figure><img class="drop" src="icon-maskable-192.png" width="96" height="96" alt="">しずく</figure>
    <figure><img class="circle" src="icon-maskable-192.png" width="48" height="48" alt="">円 @48</figure>
    <figure><img src="apple-touch-icon-180.png" width="60" height="60" style="border-radius:22%" alt="">iOS 180</figure>
  </div>
  <h2>スプラッシュ(見本)</h2>
  <div class="row"><img class="splash" src="splash.svg" alt=""></div>
</body>
</html>
